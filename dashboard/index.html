<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>DORA Metrics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f7fb;
        padding: 24px;
      }
      .card {
        background: white;
        border-radius: 10px;
        padding: 16px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <h2>DORA 4 Metrics</h2>
    <div id="summary" class="card"></div>
    <div class="card">
      <canvas id="chart" width="900" height="300"></canvas>
    </div>

    <script>
      function fmtSeconds(s) {
        if (s === null || s === undefined) return "N/A";
        let sec = Math.round(s);
        const h = Math.floor(sec / 3600);
        sec -= h * 3600;
        const m = Math.floor(sec / 60);
        sec -= m * 60;
        if (h > 0) return `${h}h ${m}m`;
        if (m > 0) return `${m}m ${sec}s`;
        return `${sec}s`;
      }

      async function loadMetrics() {
        try {
          const r = await fetch("metrics.json");
          if (!r.ok) throw new Error("metrics.json not found");
          return await r.json();
        } catch {
          return null;
        }
      }

      (async () => {
        const m = await loadMetrics();
        const summary = document.getElementById("summary");
        if (!m) {
          summary.innerHTML = "<strong>No metrics.json found.</strong> Run the workflow or download metrics.json to this folder.";
          return;
        }

        summary.innerHTML = `
          <strong>Window:</strong> ${m.window_days} days
          &nbsp; | &nbsp;
          <strong>As of:</strong> ${m.as_of}
        `;

        const labels = [
          "Deployment Frequency",
          "Change Failure Rate",
          "MTTR",
          "Lead Time"
        ];

        const values = [
          m.deployment_frequency_count ?? 0,
          m.change_failure_rate !== null ? (m.change_failure_rate * 100).toFixed(1) : 0,
          m.mttr_seconds !== null ? (m.mttr_seconds / 3600).toFixed(2) : 0,
          m.lead_time_for_changes_seconds !== null ? (m.lead_time_for_changes_seconds / 3600).toFixed(2) : 0
        ];

        const ctx = document.getElementById("chart").getContext("2d");
        new Chart(ctx, {
          type: "bar",
          data: {
            labels,
            datasets: [{
              label: "Values",
              data: values,
              backgroundColor: ["#2f80ed", "#f2994a", "#eb5757", "#27ae60"]
            }]
          },
          options: {
            responsive: true,
            plugins: {
              legend: { display: false }
            },
            scales: {
              y: { beginAtZero: false }
            }
          }
        });
      })();
    </script>
  </body>
</html>

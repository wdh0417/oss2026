name: DORA Metrics Collector

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write
  deployments: read

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      DORA_WINDOW_DAYS: '30'
      DEPLOYMENT_ENVIRONMENT: 'production'

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install deps
        run: python -m pip install --upgrade pip requests python-dateutil

      - name: Run DORA metrics script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DORA_WINDOW_DAYS: ${{ env.DORA_WINDOW_DAYS }}
          DEPLOYMENT_ENVIRONMENT: ${{ env.DEPLOYMENT_ENVIRONMENT }}
        run: |
          python github/actions-scripts/compute_dora.py > dora_metrics.log || true
          if [ -f metrics.json ]; then
            echo "metrics.json created"
            cat metrics.json
          else
            echo "metrics.json not found; check dora_metrics.log"
            cat dora_metrics.log || true
            exit 0
          fi

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: dora-metrics
          path: |
            metrics.json
            dora_metrics.log

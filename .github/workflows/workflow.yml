name: CI, build and selective deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      deploy: ${{ steps.filter.outputs.deploy }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'dashboard/**'
              - 'tools/**'
              - 'assets/**'
              - 'README.md'
              - 'metrics.yml'
              - 'throughput.yml'
            deploy:
              - 'dashboard/**'
              - 'tools/**'
              - 'assets/**'
              - 'README.md'
              - 'metrics.yml'
              - 'throughput.yml'
            ci:
              - '.github/**'
              - 'tests/**'
              - 'requirements-dev.txt'

  build:
    name: Build release bundle
    needs: changes
    if: needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create bundle
        shell: bash
        run: |
          mkdir -p dist
          python - <<'PY'
          import os
          import zipfile

          root = os.getcwd()
          output = os.path.join(root, "dist", "release-bundle.zip")
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for folder in ("dashboard", "tools", "assets"):
                  if os.path.exists(folder):
                      for dirpath, _, filenames in os.walk(folder):
                          for filename in filenames:
                              full = os.path.join(dirpath, filename)
                              zf.write(full, os.path.relpath(full, root))
              for filename in ("README.md", "metrics.yml", "throughput.yml"):
                  if os.path.exists(filename):
                      zf.write(filename, filename)
          print(f"Created {output}")
          PY

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: dist/release-bundle.zip
          if-no-files-found: error
          retention-days: 7

  test:
    name: Matrix test
    needs: changes
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    uses: ./.github/workflows/reusable-ci.yml
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}

  deploy:
    name: Deploy production bundle
    needs: [changes, build, test]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.deploy == 'true' &&
      needs.build.result == 'success' &&
      needs.test.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: dist

      - name: Deploy artifact
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$DEPLOY_URL" || -z "$DEPLOY_TOKEN" ]]; then
            echo "Deployment skipped: configure DEPLOY_URL and DEPLOY_TOKEN secrets."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 \
            -X POST \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            -F "file=@dist/release-bundle.zip" \
            "$DEPLOY_URL"
